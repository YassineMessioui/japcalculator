version: 2.1
jobs:
  build-test:
    docker:
      - image: circleci/node:14
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package.json" }}
            - v1-dependencies-
      - run: npm install
      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}
      - run: npm run test
      - run: npm run build

  pr-title:
    docker:
      - image: cimg/node:20.18.1
    steps:
      - checkout
      - run: node .circleci/validate-pr-title.mjs

  npm-audit:
    docker:
      - image: cimg/node:20.18.1
    steps:
      - checkout
      - run: npm audit --audit-level=high

workflows:
  node-tests:
    jobs:
      - build-test
      - pr-title
      - npm-audit
